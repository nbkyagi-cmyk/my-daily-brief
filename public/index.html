<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b39"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"><title>My Daily Brief</title></head><body><header><small>一日の動きを、静かに読む</small><h1>My Daily Brief</h1><p id="status"></p></header><main><p id="warning" role="status"></p><nav id="categories" aria-label="カテゴリ"></nav><div class="tools"><input id="search" type="search" placeholder="記事・情報源を検索" aria-label="検索"><select id="filter" aria-label="表示対象"><option value="all">履歴・すべて</option><option value="today">今日の新着</option><option value="saved">保存した記事</option><option value="unread">未読</option></select></div><p id="diff"></p><h2>今日の重要ニュース</h2><p class="muted">重要度が高い記事を優先。未評価の記事は新着順。</p><div id="articles"></div><details id="admin"><summary>更新管理</summary><form id="login"><label>管理パスワード<input id="password" type="password" autocomplete="current-password" required></label><button>ログイン</button></form><div id="controls" hidden><label>更新対象<select id="target"><option value="all">すべてのカテゴリ</option></select></label><button id="update">今すぐ更新</button><button id="logout">ログアウト</button></div><p id="message" role="status"></p><p>自動更新は毎日18時ごろ。手動更新はサーバーで実行します。</p><h3>更新履歴</h3><div id="runs"></div></details></main><footer>事実欄は出典の概要。AI分析は推測を含みます。原文で確認してください。</footer><script src="./app.js" defer></script></body></html>
