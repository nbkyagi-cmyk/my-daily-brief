name: Daily production update
on:
  schedule:
    - cron: '7 9 * * *'
permissions: {}
concurrency:
  group: daily-production
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Update production server and wait for result
        env:
          MDB_URL: ${{ secrets.MDB_URL }}
          MDB_SCHEDULE_TOKEN: ${{ secrets.MDB_SCHEDULE_TOKEN }}
        shell: python
        run: |
          import json, os, time, urllib.request
          base = os.environ['MDB_URL'].rstrip('/')
          if not base.startswith('https://'): raise SystemExit('HTTPS URL required')
          req = urllib.request.Request(base+'/api/scheduled', data=b'{}', headers={'Content-Type':'application/json','Authorization':'Bearer '+os.environ['MDB_SCHEDULE_TOKEN']})
          with urllib.request.urlopen(req, timeout=30) as r: result=json.load(r)
          if result.get('skipped'): raise SystemExit(0)
          deadline=time.monotonic()+850
          while time.monotonic()<deadline:
              with urllib.request.urlopen(base+'/api/news', timeout=20) as r: data=json.load(r)
              run=next((r for r in data['runs'] if r['id']==result['id']),None)
              if run and run['status']!='running':
                  print('Update status:',run['status'],'new articles:',run['added'])
                  raise SystemExit(0 if run['status']=='success' else 1)
              time.sleep(10)
          raise SystemExit('Remote update timed out; inspect server update history')
