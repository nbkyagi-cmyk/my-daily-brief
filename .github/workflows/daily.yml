name: Daily production update
on:
  schedule:
    - cron: '7 9 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: daily-production
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run all tests
        run: python -m unittest discover -s tests -v
      - name: Restore history, fetch news and analyze new articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MDB_AI_LIMIT: ${{ vars.MDB_AI_LIMIT || '10' }}
        run: python -m app.publish
      - name: Commit only public JSON files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/articles.json docs/articles.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily news'
            # Reject concurrent main changes rather than overwrite newer history.
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy updated docs
        id: deployment
        uses: actions/deploy-pages@v4
